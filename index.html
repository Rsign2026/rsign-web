<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sito in Lavorazione</title>
<!-- Tailwind CSS for modern, responsive styling -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
<div class="max-w-xl w-full bg-slate-800/60 backdrop-blur-md border border-slate-700 p-8 md:p-12 rounded-2xl shadow-2xl text-center">
<!-- Icon -->
<div class="w-20 h-20 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl animate-pulse">
<i class="fa-solid fa-person-digging"></i>
</div>
​<!-- Heading -->
<h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-3">Stiamo arrivando!</h1>
<p class="text-slate-400 text-base md:text-lg mb-8">
Il nostro sito web è attualmente in fase di rinnovamento. Lavoriamo sodo per offrirti presto una nuova esperienza online.
</p>
​<!-- Newsletter / Contact Box -->
<div class="border-t border-slate-700/60 pt-6">
<p class="text-sm text-slate-400 mb-4">Vuoi essere avvisato quando saremo online?</p>
<form onsubmit="event.preventDefault(); alert('Grazie per esserti iscritto!');" class="flex flex-col sm:flex-row gap-3">
<input type="email" placeholder="Il tuo indirizzo email" required class="flex-1 bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
<button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-lg text-sm transition shadow-lg shadow-indigo-600/20">
Avvisami
</button>
</form>
</div>
​<!-- Footer -->
<div class="mt-8 text-xs text-slate-500">
© 2026 Tutti i diritti riservati.
</div>
</div>
</body>
</html>
